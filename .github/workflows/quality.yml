name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}\src
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/console.txt
            requirements/dev.txt
            requirements/editing.txt

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements/console.txt -r requirements/editing.txt -r requirements/dev.txt

      - name: Check Python syntax
        run: python -m compileall -q src tests scripts/audit_public_release.py

      - name: Run low-noise static checks
        run: python -m ruff check src tests scripts/audit_public_release.py scripts/check_distribution.py

      - name: Audit public Git content and history
        run: python scripts/audit_public_release.py --history

      - name: Scan for high-severity security findings
        run: python -m bandit -r src -lll -iii

      - name: Run unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Build and inspect distributions
        run: |
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
          python scripts/check_distribution.py dist
