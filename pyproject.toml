[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-en-dubber"
version = "0.1.0b1"
description = "Local Russian-to-English video dubbing pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dubbing", "transcription", "translation", "premiere", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = ["rich>=15,<16"]

[project.scripts]
ru-en-dubber = "ru_en_dubber.cli:main"
ru-en-dubber-web = "ru_en_dubber.web.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ru_en_dubber" = ["agent_prompts.json"]
"ru_en_dubber.web" = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".models",
    ".tools",
    ".venv",
    ".venv-chatterbox",
    ".venv-musetalk",
    ".venv-whisperx",
    "jobs",
]

[tool.ruff.lint]
# Keep the first gate deliberately low-noise: syntax errors, invalid control
# flow and unresolved names. Broader style cleanup should be a separate change.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["ru_en_dubber"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
